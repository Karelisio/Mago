<!doctype html>
<html lang="fr" data-theme="%VITRINE_DEFAULT_THEME%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%VITRINE_TITLE%</title>
    <meta name="description" content="%VITRINE_DESCRIPTION%" />
    <meta property="og:title" content="%VITRINE_TITLE%" />
    <meta property="og:description" content="%VITRINE_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- vitrine:head -->
    <script>
      // Avant le premier rendu : thème choisi (sinon celui de config.json) et
      // palette personnalisée mise en cache par l'app.
      (function () {
        var root = document.documentElement;
        var theme;
        try { theme = localStorage.getItem('vitrine:theme'); } catch (e) {}
        root.setAttribute('data-theme', theme === 'light' || theme === 'dark' ? theme : '%VITRINE_DEFAULT_THEME%');
        try {
          var css = localStorage.getItem('vitrine:accent-css');
          if (css && css.indexOf(':root[data-theme=') === 0) {
            var style = document.createElement('style');
            style.id = 'vitrine-theme-runtime';
            style.textContent = css;
            document.head.appendChild(style);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Cette page a besoin de JavaScript pour afficher les projets.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
